x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gitlab:
    logging: *default-logging
    image: '${GITLAB_IMAGE}'
    container_name: '${GITLAB_CONTAINER_NAME}'
    restart: always
    hostname: '${GITLAB_HOST}'
    environment:
      GITLAB_SAML_IDP_SSO_URL: '${GITLAB_SAML_IDP_SSO_URL}'
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOST}'
        nginx['ssl_certificate'] = '/etc/gitlab/ssl/${GITLAB_HOST}.crt'
        nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/${GITLAB_HOST}.key'

        # Registry Settings
        registry_external_url 'https://${GITLAB_HOST}:${GITLAB_REGISTRY_PORT}'
        gitlab_rails['registry_enabled'] = true
        gitlab_rails['registry_host'] = '${GITLAB_HOST}'
        gitlab_rails['registry_port'] = '${GITLAB_REGISTRY_PORT}'        

        # OmniAuth + SAML (Entra)
        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['saml']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_auto_link_saml_user'] = true
        gitlab_rails['omniauth_providers'] = [
          {
            name: 'saml',
            label: 'NBCC SSO',
            args: {
              # Must be external_url + the SAML callback path:
              assertion_consumer_service_url: "https://${GITLAB_HOST}/users/auth/saml/callback",

              # Entra SAML SSO endpoint ("Login URL")
              idp_sso_target_url: ENV['GITLAB_SAML_IDP_SSO_URL'],

              # GitLab's SP "issuer" (Entity ID)
              issuer: "https://${GITLAB_HOST}",

              # NameID format Entra will send
              name_identifier_format: 'urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress',

              idp_cert: File.read('/idp-cert.pem')             
            }
          }
        ]

        # Shared runners
        gitlab_rails['shared_runners_enabled'] = true

    ports:
      - '${GITLAB_HTTP_PORT}:80'
      - '${GITLAB_HTTPS_PORT}:443'
      - '${GITLAB_SSH_PORT}:22'
      - '${GITLAB_REGISTRY_PORT}:5005'  
    volumes:
      - './mounts/prod/gitlab-data/config:/etc/gitlab'
      - './mounts/prod/gitlab-data/logs:/var/log/gitlab'
      - './mounts/prod/gitlab-data/data:/var/opt/gitlab'
      - './certs/cert.pem:/etc/gitlab/ssl/${GITLAB_HOST}.crt:ro'
      - './certs/key.pem:/etc/gitlab/ssl/${GITLAB_HOST}.key:ro'
      - './certs/idp-cert.pem:/idp-cert.pem:ro'
    networks:
      - gitlab-net    
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS https://localhost/-/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s    

  gitlab-runner:
    logging: *default-logging
    image: '${GITLAB_RUNNER_IMAGE}'
    container_name: '${GITLAB_RUNNER_CONTAINER_NAME}'
    restart: always
    depends_on:
      - gitlab
    volumes:
      - './runner_config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './certs/cert.pem:/etc/gitlab-runner/certs/ca.crt:ro'
    environment:
      - DOCKER_NETWORK_MODE=gitlab-net
      - CI_SERVER_TLS_CA_FILE=/etc/gitlab-runner/certs/ca.crt
      - FF_USE_ADAPTIVE_REQUEST_CONCURRENCY=true
    networks:
      - gitlab-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep gitlab-runner || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5    

networks:
  gitlab-net:
    name: gitlab-net

volumes:
  runner_config:
    driver: local

